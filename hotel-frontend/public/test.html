<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Test Roles</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    button { padding: 8px 16px; margin: 4px; cursor: pointer; }
    pre { background: #f0f0f0; padding: 10px; min-height: 100px; }
    input { padding: 6px; margin: 4px; }
  </style>
</head>
<body>
  <h2>Test Roles Guard</h2>

  <div>
    Login : <input id="login" value="admin" />
    Mot de passe : <input id="mdp" value="admin123" />
  </div>

  <button onclick="creerClient()">0. Créer utilisateur client</button>
  <button onclick="login()">1. Se connecter</button>
  <button onclick="sansToken()">2. GET /utilisateur SANS token</button>
  <button onclick="avecToken()">3. GET /utilisateur AVEC token</button>

  <pre id="resultat">Résultat...</pre>

  <script>
    const resultat = document.getElementById('resultat');
    let token = null;

    async function creerClient() {
      resultat.textContent = 'Création du client...';
      const res = await fetch('http://localhost:3000/utilisateur', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nom: 'Dupont',
          prenom: 'Jean',
          login: 'client1',
          mot_de_passe: 'client123',
          role: 'client'
        })
      });
      const data = await res.json();
      resultat.textContent = 'Code : ' + res.status + '\n\n' +
        JSON.stringify(data, null, 2);
    }

    async function login() {
      resultat.textContent = 'Connexion...';
      const res = await fetch('http://localhost:3000/utilisateur/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          login: document.getElementById('login').value,
          mot_de_passe: document.getElementById('mdp').value
        })
      });
      const data = await res.json();
      token = data.access_token;
      resultat.textContent = 'Code : ' + res.status + '\n\n' +
        JSON.stringify(data, null, 2) +
        (token ? '\n\n✅ Token stocké.' : '\n\n❌ Pas de token.');
    }

    async function sansToken() {
      resultat.textContent = 'Appel SANS token...';
      const res = await fetch('http://localhost:3000/utilisateur');
      const data = await res.json();
      resultat.textContent = 'Code : ' + res.status + '\n\n' +
        JSON.stringify(data, null, 2);
    }

    async function avecToken() {
      if (!token) {
        resultat.textContent = '⚠️ Clique d\'abord sur le bouton 1.';
        return;
      }
      resultat.textContent = 'Appel AVEC token...';
      const res = await fetch('http://localhost:3000/utilisateur', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const data = await res.json();
      resultat.textContent = 'Code : ' + res.status + '\n\n' +
        JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
