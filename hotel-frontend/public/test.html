<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Test JWT</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    button { padding: 8px 16px; margin: 4px; cursor: pointer; }
    pre { background: #f0f0f0; padding: 10px; min-height: 100px; }
  </style>
</head>
<body>
  <h2>Test JWT</h2>

  <button onclick="login()">1. Se connecter (récupérer token)</button>
  <button onclick="testSansToken()">2. GET /utilisateur SANS token</button>
  <button onclick="testAvecToken()">3. GET /utilisateur AVEC token</button>

  <pre id="resultat">Résultat...</pre>

  <script>
    const resultat = document.getElementById('resultat');
    let token = null;

    async function login() {
      resultat.textContent = 'Connexion...';
      const res = await fetch('http://localhost:3000/utilisateur/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login: 'admin', mot_de_passe: 'admin123' })
      });
      const data = await res.json();
      token = data.access_token;
      resultat.textContent = 'Code : ' + res.status + '\n\n' +
        JSON.stringify(data, null, 2) +
        (token ? '\n\n✅ Token stocké en mémoire.' : '\n\n❌ Pas de token.');
    }

    async function testSansToken() {
      resultat.textContent = 'Appel SANS token...';
      const res = await fetch('http://localhost:3000/utilisateur');
      const data = await res.json();
      resultat.textContent = 'Code : ' + res.status + '\n\n' +
        JSON.stringify(data, null, 2);
    }

    async function testAvecToken() {
      if (!token) {
        resultat.textContent = '⚠️ Clique d\'abord sur le bouton 1 (login).';
        return;
      }
      resultat.textContent = 'Appel AVEC token...';
      const res = await fetch('http://localhost:3000/utilisateur', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const data = await res.json();
      resultat.textContent = 'Code : ' + res.status + '\n\n' +
        JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
